[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "splitaudit"
version = "0.1.0"
description = "SplitAudit: quantify validation-split optimism on grouped data (site/taxon/patient leakage)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "scipy>=1.11", "pandas>=2.1", "scikit-learn>=1.3"]
[project.optional-dependencies]
dev = ["pytest>=8"]
[project.scripts]
splitaudit = "splitaudit.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
